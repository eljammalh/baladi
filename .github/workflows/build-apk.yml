name: Build Baladi APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Download the Tajawal Arabic font
        run: |
          mkdir -p app/src/main/res/font
          base="https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal"
          curl -fsSL --retry 3 -o app/src/main/res/font/tajawal_regular.ttf   "$base/Tajawal-Regular.ttf"
          curl -fsSL --retry 3 -o app/src/main/res/font/tajawal_medium.ttf    "$base/Tajawal-Medium.ttf"
          curl -fsSL --retry 3 -o app/src/main/res/font/tajawal_bold.ttf      "$base/Tajawal-Bold.ttf"
          curl -fsSL --retry 3 -o app/src/main/res/font/tajawal_extrabold.ttf "$base/Tajawal-ExtraBold.ttf"
          ls -la app/src/main/res/font

      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BALADI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BALADI_KEYSTORE_PASSWORD || vars.BALADI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BALADI_KEY_ALIAS || vars.BALADI_KEY_ALIAS || 'baladi' }}
          KEY_PASSWORD: ${{ secrets.BALADI_KEY_PASSWORD || vars.BALADI_KEY_PASSWORD || secrets.BALADI_KEYSTORE_PASSWORD || vars.BALADI_KEYSTORE_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/baladi-release.jks"
          use_temp_key() {
            echo "::warning::$1 The APK will be signed with a temporary key (you must uninstall the app before installing each new build)."
          }
          if [ -z "$KEYSTORE_BASE64" ]; then
            use_temp_key "Secret BALADI_KEYSTORE_BASE64 is missing."
            exit 0
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            use_temp_key "Secret BALADI_KEYSTORE_PASSWORD is missing (add it under Secrets or Variables)."
            exit 0
          fi
          # The key is the longest unbroken run of key characters in what was pasted;
          # this ignores labels, spaces or extra lines copied along with it by accident.
          cleaned=$(printf '%s' "$KEYSTORE_BASE64" | tr -c 'A-Za-z0-9+/=' '\n' \
            | awk '{ if (length($0) > length(best)) best = $0 } END { print best }')
          if ! printf '%s' "$cleaned" | base64 -d > "$ks" 2>/dev/null; then
            use_temp_key "Secret BALADI_KEYSTORE_BASE64 is damaged (it should be one long line, copied completely, length 2836 characters; yours is ${#cleaned})."
            exit 0
          fi
          # Try the password exactly as pasted, trimmed, and every word in it,
          # so a label or space copied along with it does not break signing.
          found_pw=""; found_alias=""
          candidates=$( { printf '%s\n' "$KEYSTORE_PASSWORD"; printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \t\r\n'; echo; printf '%s' "$KEYSTORE_PASSWORD" | tr -c 'A-Za-z0-9' '\n'; } | awk 'length($0) >= 6 && !seen[$0]++')
          aliases=$( { printf '%s\n' "$KEY_ALIAS" | tr -d ' \t\r'; echo baladi; } | awk 'length($0) > 0 && !seen[$0]++')
          while IFS= read -r pw; do
            while IFS= read -r al; do
              if keytool -list -keystore "$ks" -storepass "$pw" -alias "$al" > /dev/null 2>&1; then
                found_pw="$pw"; found_alias="$al"; break 2
              fi
            done <<< "$aliases"
          done <<< "$candidates"
          if [ -z "$found_pw" ]; then
            use_temp_key "The signing key could not be opened with BALADI_KEYSTORE_PASSWORD. Re-paste the 20-character password (nothing else) and run again."
            exit 0
          fi
          echo "::add-mask::$found_pw"
          {
            echo "BALADI_KEYSTORE_PATH=$ks"
            echo "BALADI_KEYSTORE_PASSWORD=$found_pw"
            echo "BALADI_KEY_ALIAS=$found_alias"
            echo "BALADI_KEY_PASSWORD=$found_pw"
          } >> "$GITHUB_ENV"
          echo "Release signing key found and verified."

      - name: Build the APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Baladi-build-${{ github.run_number }}.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v5
        with:
          name: Baladi-APK-build-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30

      - name: Publish a GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
