name: Build Baladi APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Download the Tajawal Arabic font
        run: |
          mkdir -p app/src/main/res/font
          base="https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal"
          curl -fsSL --retry 3 -o app/src/main/res/font/tajawal_regular.ttf   "$base/Tajawal-Regular.ttf"
          curl -fsSL --retry 3 -o app/src/main/res/font/tajawal_medium.ttf    "$base/Tajawal-Medium.ttf"
          curl -fsSL --retry 3 -o app/src/main/res/font/tajawal_bold.ttf      "$base/Tajawal-Bold.ttf"
          curl -fsSL --retry 3 -o app/src/main/res/font/tajawal_extrabold.ttf "$base/Tajawal-ExtraBold.ttf"
          ls -la app/src/main/res/font

      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BALADI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BALADI_KEYSTORE_PASSWORD || vars.BALADI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BALADI_KEY_ALIAS || vars.BALADI_KEY_ALIAS || 'baladi' }}
          KEY_PASSWORD: ${{ secrets.BALADI_KEY_PASSWORD || vars.BALADI_KEY_PASSWORD || secrets.BALADI_KEYSTORE_PASSWORD || vars.BALADI_KEYSTORE_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/baladi-release.jks"
          use_temp_key() {
            echo "::warning::$1 The APK will be signed with a temporary key (you must uninstall the app before installing each new build)."
          }
          if [ -z "$KEYSTORE_BASE64" ]; then
            use_temp_key "Secret BALADI_KEYSTORE_BASE64 is missing."
            exit 0
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            use_temp_key "Secret BALADI_KEYSTORE_PASSWORD is missing (add it under Secrets or Variables)."
            exit 0
          fi
          # Remove spaces and line breaks that sneak in when copying the long key text
          cleaned=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n')
          if ! printf '%s' "$cleaned" | base64 -d > "$ks" 2>/dev/null; then
            use_temp_key "Secret BALADI_KEYSTORE_BASE64 is damaged (it should be one long line, copied completely, length 2836 characters; yours is ${#cleaned})."
            exit 0
          fi
          if ! keytool -list -keystore "$ks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            use_temp_key "The signing key could not be opened. Check BALADI_KEYSTORE_PASSWORD and BALADI_KEY_ALIAS."
            exit 0
          fi
          {
            echo "BALADI_KEYSTORE_PATH=$ks"
            echo "BALADI_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BALADI_KEY_ALIAS=$KEY_ALIAS"
            echo "BALADI_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Release signing key found and verified."

      - name: Build the APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Baladi-build-${{ github.run_number }}.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v5
        with:
          name: Baladi-APK-build-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30

      - name: Publish a GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
